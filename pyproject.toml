[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "druks-test-stub-ledger"
version = "0.1.0"
description = "Double-entry accounting ledger slice: chart of accounts, journal entries, trial balance."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
