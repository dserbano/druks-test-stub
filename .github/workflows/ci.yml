name: ci
on:
  pull_request:
    paths-ignore: ["docs/**"]
  push:
    branches: [main]
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh .ci/check-notes.sh
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # main carries .ci/e2e-broken while the "red on the default branch too" case runs.
      - run: |
          if [ -f .ci/e2e-broken ]; then
            echo "FAIL: e2e is broken (.ci/e2e-broken)"
            exit 1
          fi
  length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for note in notes/*.txt; do
            [ -e "$note" ] || continue
            lines=$(wc -l < "$note")
            if [ "$lines" -gt 2 ]; then
              echo "FAIL: $note has $lines lines. A note has at most 2: its '# ' title and 'Checked.'"
              exit 1
            fi
          done
  # Runs only once notes and e2e finish, so GitHub creates its check run in a second wave.
  wave:
    needs: [notes, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: sleep 45
  external-lint:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@v4
      # Stands in for an outside CI service, which reports through a commit status, not a check run.
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          post() { gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" -f context=external/lint -f state="$1" -f description="$2"; }
          post pending "Linting notes"
          sleep 30
          for note in notes/*.txt; do
            [ -e "$note" ] || continue
            if ! head -n 1 "$note" | grep -q '^# '; then
              post failure "$note must start with a title line beginning with '# '"
              exit 0
            fi
          done
          post success "Every note has a title"
  # Stands in for an outside service that rejects one test's note; the note's name is the only trigger.
  compliance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          post() { gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" -f context=external/compliance -f state="$1" -f description="$2"; }
          if git diff --name-only HEAD^1 HEAD | grep -q '^notes/dse-1044-v4-ta.txt$'; then
            post failure "Compliance has not cleared notes/dse-1044-v4-ta.txt"
          elif git diff --name-only HEAD^1 HEAD | grep -q '^notes/dse-1044-v4-te.txt$' && ! head -n 1 notes/dse-1044-v4-te.txt | grep -q '(cleared)$'; then
            post failure "The title line of notes/dse-1044-v4-te.txt must end with (cleared)"
          else
            post success "Nothing to clear"
          fi
  # Runs past an hour for one test's note, so the build's CI wait reaches its limit.
  slow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          if git diff --name-only HEAD^1 HEAD | grep -q '^notes/dse-1044-v4-td.txt$'; then
            sleep 3900
          fi
