name: ci
on:
  pull_request:
    paths-ignore: ["docs/**"]
  push:
    branches: [main]
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh .ci/check-notes.sh
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # main carries .ci/e2e-broken while the "red on the default branch too" case runs.
      - run: if [ -f .ci/e2e-broken ]; then echo "FAIL: e2e is broken (.ci/e2e-broken)"; exit 1; fi
