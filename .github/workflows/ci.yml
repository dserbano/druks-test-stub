name: ci
on:
  pull_request:
    paths-ignore: ["docs/**"]
  push:
    branches: [main]
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh .ci/check-notes.sh
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # main carries .ci/e2e-broken while the "red on the default branch too" case runs.
      - run: |
          if [ -f .ci/e2e-broken ]; then
            echo "FAIL: e2e is broken (.ci/e2e-broken)"
            exit 1
          fi
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
  external-lint:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@v4
      # Stands in for an outside CI service, which reports through a commit status, not a check run.
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          post() { gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" -f context=external/lint -f state="$1" -f description="$2"; }
          post pending "Linting notes"
          sleep 30
          for note in notes/*.txt; do
            [ -e "$note" ] || continue
            if ! head -n 1 "$note" | grep -q '^# '; then
              post failure "$note must start with a title line beginning with '# '"
              exit 0
            fi
          done
          post success "Every note has a title"
